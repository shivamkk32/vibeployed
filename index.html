<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#171717" />

    <!-- Tab strip: the icon, and the title that browsers show on tab hover. -->
    <link rel="icon" type="image/png" href="/vibeployed-logo.png" />
    <link rel="apple-touch-icon" href="/vibeployed-logo.png" />

    <title>Vibeployed · Ship to any cloud. Optimized and protected.</title>
    <meta
      name="description"
      content="Connect a repository and a cloud account. Vibeployed reads the code, designs the architecture, and shows you the diagram and the monthly bill, before a single resource exists."
    />
    <link rel="canonical" href="https://vibeployed.com/" />

    <!-- Link preview card: WhatsApp, Slack, iMessage, LinkedIn, Facebook, X.
         og:image must be an absolute URL or the crawlers will not fetch it. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Vibeployed" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://vibeployed.com/" />
    <meta property="og:title" content="Ship to any cloud. Optimized and protected." />
    <meta
      property="og:description"
      content="Vibeployed reads your code, designs the architecture, and shows you the diagram and the monthly bill before a single resource exists."
    />
    <meta property="og:image" content="https://vibeployed.com/share-card.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Vibeployed. Ship to any cloud. Optimized and protected."
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ship to any cloud. Optimized and protected." />
    <meta
      name="twitter:description"
      content="Vibeployed reads your code, designs the architecture, and shows you the diagram and the monthly bill before a single resource exists."
    />
    <meta name="twitter:image" content="https://vibeployed.com/share-card.png" />
    <meta
      name="twitter:image:alt"
      content="Vibeployed. Ship to any cloud. Optimized and protected."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..900&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!--
      Structured data. Static on purpose: this is the one block crawlers must
      see without executing JavaScript, and these three entities never change
      per route. The FAQ schema is generated from src/lib/data.ts instead, so
      the questions on the page and the questions in the markup cannot drift.

      @id values are stable URIs so the graph nodes can reference each other.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://vibeployed.com/#organization",
            "name": "Vibeployed",
            "url": "https://vibeployed.com/",
            "logo": {
              "@type": "ImageObject",
              "url": "https://vibeployed.com/vibeployed-logo.png"
            },
            "description": "Vibeployed reads your code, designs the cloud architecture, and shows you the diagram and the monthly bill before a single resource exists.",
            "email": "support.vibeployed@gmail.com",
            "telephone": "+1-508-579-8978",
            "address": {
              "@type": "PostalAddress",
              "streetAddress": "8457 Reformatory Way",
              "addressLocality": "Lorton",
              "addressRegion": "VA",
              "postalCode": "22079",
              "addressCountry": "US"
            },
            "contactPoint": {
              "@type": "ContactPoint",
              "contactType": "customer support",
              "email": "support.vibeployed@gmail.com",
              "telephone": "+1-508-579-8978",
              "availableLanguage": "English"
            },
            "sameAs": [
              "https://github.com/shivamkk32/vibeployed",
              "https://x.com/vibeployed",
              "https://www.linkedin.com/company/vibeployed"
            ]
          },
          {
            "@type": "WebSite",
            "@id": "https://vibeployed.com/#website",
            "url": "https://vibeployed.com/",
            "name": "Vibeployed",
            "inLanguage": "en-US",
            "publisher": { "@id": "https://vibeployed.com/#organization" }
          },
          {
            "@type": "SoftwareApplication",
            "@id": "https://vibeployed.com/#software",
            "name": "Vibeployed",
            "url": "https://vibeployed.com/",
            "applicationCategory": "DeveloperApplication",
            "applicationSubCategory": "Cloud deployment automation",
            "operatingSystem": "Web browser",
            "description": "Connect a repository and a cloud account. Vibeployed scans the code, designs the architecture, estimates the monthly cost, and deploys to AWS, Google Cloud or Azure only after you approve the plan.",
            "featureList": [
              "Automated source code and dependency scanning",
              "High-level and low-level architecture diagrams",
              "Monthly cloud cost estimates before provisioning",
              "Auto, Manual and Audit deployment modes",
              "Terraform and Pulumi export",
              "Transactional rollback on failed stages"
            ],
            "publisher": { "@id": "https://vibeployed.com/#organization" },
            "offers": [
              {
                "@type": "Offer",
                "name": "Solo",
                "price": "0",
                "priceCurrency": "USD",
                "description": "One connected cloud account, three deployments a month."
              },
              {
                "@type": "Offer",
                "name": "Team",
                "price": "49",
                "priceCurrency": "USD",
                "description": "Unlimited cloud accounts and deployments, billed monthly."
              }
            ]
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
